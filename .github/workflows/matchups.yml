name: Rebuild Matchups

on:
  schedule:
    - cron: '30 18 * * *'  # 1030am pst
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rebuild via API
        env:
          API_BASE: https://tfpl.onrender.com
          ADMIN_API_KEY: ${{ secrets.TFPL_ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          echo "Calling $API_BASE/api/admin/rebuild-matchups ..."
          curl -sS -X POST -H "X-Api-Key: wefbthneh9wf6cv23irj2f892e23fq23fn2309t24423t2fvawervweg234t" "$API_BASE/api/admin/rebuild-matchups"
