name: Wake Render
on:
  schedule:
    - cron: "48 10 * * *"  # 2:48 AM PST
  workflow_dispatch:

jobs:
  wakeup:
    runs-on: ubuntu-latest
    steps:
      - name: Try to wake up Render backend
        run: |
          URL="https://tfpl.onrender.com/ping"
          MAX_ATTEMPTS=20
          DELAY=30

          echo "Pinging $URL every $DELAY seconds, up to $MAX_ATTEMPTS times..."

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ Backend is awake (HTTP $STATUS) on attempt $i"
              exit 0
            fi
            
            echo "Attempt $i: Backend still asleep (HTTP $STATUS)"
            sleep $DELAY
          done

          echo "❌ Failed to wake backend after $MAX_ATTEMPTS attempts"
          exit 1
